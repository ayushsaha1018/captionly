services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: captionly
      POSTGRES_PASSWORD: captionly
      POSTGRES_DB: captionly
    ports:
      # host port 5434 (not 5432) to avoid clashing with a local Postgres install
      - "5434:5432"
    volumes:
      - ./docker/init-neon-local.sql:/docker-entrypoint-initdb.d/init-neon-local.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captionly"]
      interval: 2s
      timeout: 5s
      retries: 10

  # neondatabase/neon_local requires a real Neon cloud project + API key even in
  # "postgres" driver mode (it provisions an ephemeral cloud branch under the hood) —
  # not viable for an offline local dev loop. This community proxy (recommended in
  # Neon's own "local-development-with-neon" guide) speaks the same neon-http wire
  # protocol against a plain local Postgres, no cloud account needed.
  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://captionly:captionly@postgres:5432/captionly
    ports:
      - "5433:4444"
    depends_on:
      postgres:
        condition: service_healthy
